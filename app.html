<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Steht VOR dem Pre-Flight, damit dieses die Farbe fuer die CL
         sofort umsetzen kann (Android-Statusleiste sonst kurz gruen). -->
    <meta name="theme-color" content="#28a745">
    <!-- FOUC-Schutz: aktives Turnier früh bestimmen und – nur für die CL –
         Blau (Hintergrund + Grün/Gold→Blau-Variablen) noch vor dem ersten
         Paint anwenden. Spiegelt die Auflösung aus tournament-config.js; die
         volle Logik (theme-cl.css) folgt direkt danach. WM: es wird nur
         data-tournament gesetzt – das Aussehen bleibt unverändert. -->
    <script>
    (function(){try{
      var h=(location.hostname||"").toLowerCase();
      var q=new URLSearchParams(location.search);
      function L(n){try{return localStorage.getItem(n);}catch(e){return null;}}
      // Gleiche Reihenfolge wie resolveTournamentKey() in tournament-config.js:
      // Preview > URL(?tournament) > Dev-Override > Domain > Fallback.
      // Die Domain-Zeile ist der EFFEKTIVE Default (zeitgesteuerter
      // defaultActiveFrom hat Vorrang vor DOMAIN_TOURNAMENT_MAP); der
      // Fallback bleibt FALLBACK_TOURNAMENT_KEY. Beides bewusst doppelt
      // gepflegt, weil APP_CONFIG hier noch nicht geladen ist –
      // scripts/test-preflight-default.js haelt es deckungsgleich.
      var k=q.get("preview")||L("dreamteam_preview_"+h)||q.get("tournament")||L("dreamteam_dev_override_"+h)||({"dt.alae.app":"cl2627"})[h]||"wm2026";
      k=String(k).trim().toLowerCase();
      var d=document.documentElement;
      d.setAttribute("data-tournament",k);
      // Eingebettet in die App-Shell (app.html)? Dann eigene Navigation
      // verstecken und keinen Platz dafuer reservieren (CSS in styles.css)
      // - die Shell bringt ihre eigene, persistente Leiste mit.
      try{if(window.self!==window.top)d.setAttribute("data-dt-embedded","1");}catch(eEmb){d.setAttribute("data-dt-embedded","1");}
      if(/^cl/.test(k)){
        d.style.background="#0a1633";
        var tc=document.querySelector('meta[name="theme-color"]');
        if(tc)tc.setAttribute("content","#0a1633");
        var s=document.createElement("style");
        s.id="cl-critical-theme";
        s.textContent=':root[data-tournament^="cl"]{--green-light:#7db4ff;--green-main:#3d8bff;--green-deep:#3d8bff;--green-accent:#3d8bff;--green-glow:rgba(61,139,255,.35);--gold:#7db4ff;--gold-light:#a9cbff;--gold-dark:#3d8bff;--gold-amber:#3d8bff;--gold-amber2:#2f6fd0;--rgb-green-1:61,139,255;--rgb-green-2:61,139,255;--rgb-green-3:125,180,255;--rgb-gold:125,180,255;--rgb-amber:61,139,255;--primary:#3d8bff;--cl-primary:#3d8bff;--cl-accent:#7db4ff;--cl-background:#0a1633;--cl-surface:#132347;--cl-surface-alt:#0f1c3d;--cl-text:#dce8ff;--cl-text-muted:#9db6e8;--green-bg-1:#0a1633;--green-bg-2:#081029;--green-bg-3:#0a1633;}html[data-tournament^="cl"] body{background-color:#0a1633;color:#dce8ff;}[data-tournament^="cl"] .hero::before,[data-tournament^="cl"] #indexHomePostStart,[data-tournament^="cl"] #indexHomePreStart{background:#0a1633;}';
        (document.head||d).appendChild(s);
      }
      // Kaderdatei-Preload: data.js laedt sie spaeter synchron via
      // document.write – der Preload startet den Download schon jetzt,
      // parallel zum HTML-Parsing. CL-Saisons folgen dem Muster
      // data-cl<jahr>.js, alles andere faellt auf die WM zurueck – so muss
      // hier bei einer neuen CL-Saison nichts nachgezogen werden; bei
      // Abweichung kostet es ohnehin nur einen unnoetigen Request.
      var df=/^cl\d{4}$/.test(k)?("data-"+k+".js"):"data-wm2026.js";
      var pl=document.createElement("link");
      pl.rel="preload";pl.as="script";pl.href=df+"?v=__BUILD__";
      (document.head||d).appendChild(pl);
    }catch(e){}})();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>DreamTeam</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DreamTeam">
<link rel="manifest" href="Icons/site.webmanifest?v=__BUILD__">
    <link rel="icon" type="image/x-icon" href="Icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="Icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="Icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="Icons/favicon-48x48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="Icons/apple-touch-icon.png">
    <link rel="mask-icon" href="Icons/maskable-icon-192x192.png" color="#28a745">
    <meta name="msapplication-config" content="Icons/browserconfig.xml">
    <meta name="view-transition" content="same-origin">
    <meta name="description" content="DreamTeam – Fantasy-Fussball. Baue dein Team und verfolge Live-Punkte.">

    <!-- Frühe Verbindungsöffnung zu Firebase + CDN; spart auf Mobile
         häufig 100–300 ms TLS/DNS. -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>

    <!-- Firebase-Compat-SDK: Download startet dank preload sofort und
         parallel zum HTML-Parsing; die eigentlichen <script>-Tags stehen
         am Body-Ende direkt VOR tournament-config.js. So blockiert das
         SDK nicht mehr den First Paint, aber die Ausführungs-Reihenfolge
         (firebase → APP_CONFIG → App-Skripte) bleibt exakt wie bisher –
         inklusive der Inline-Body-Skripte, die `APP.getDb()` auf
         Top-Level aufrufen. Bewusst KEIN `defer`: das hat frueher zu
         einer "Firebase SDK noch nicht geladen"-Regression gefuehrt. -->
    <link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    <link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    <link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">

<link rel="stylesheet" href="styles.css?v=__BUILD__">

    <!-- CL-Theme STATISCH und render-blocking: vollstaendig auf
         [data-tournament^="cl"] gescopet, fuer die WM also ein No-op.
         Vorher haengte tournament-config.js dieses Stylesheet erst nach
         dem JS-Boot ein - die ab dem ersten Frame sichtbare Navigation
         blitzte deshalb kurz im gruenen WM-Look auf. Die id behaelt der
         dynamische Lader als Schon-da-Signal. -->
    <link rel="stylesheet" href="theme-cl.css?v=__BUILD__" id="cl-theme-css">
</head>
<body class="dt-shell-body">
<!-- ===== STATIC NAV (Spiegel von nav.js) =====
     Die Navigation steht statisch im HTML, damit sie mit dem ersten Frame
     gezeichnet wird (kein spätes Aufploppen nach dem JS-Boot) und bei
     Seitenübergängen (View Transitions, styles.css) als feststehende
     Leiste durchläuft. nav.js baut sie nicht mehr neu, sondern hydriert
     sie nur: ?tournament=-Parameter auf den Links, Markenlabel aus
     APP_CONFIG, Team-Builder-Status, Auth-Knopf. Der Block muss auf allen
     Seiten identisch sein (bis auf den active-Link) –
     scripts/test-static-nav.js prüft das. -->
<nav class="navbar">
    <a href="index.html" class="navbar-brand" aria-label="DreamTeam">
        <span class="brand-line">
            <span class="brand-gold">&nbsp;</span>
            <span class="brand-green">DreamTeam</span>
        </span>
        <span class="brand-season" hidden></span>
    </a>
    <div class="nav-actions">
        <div class="nav-links">
            <a href="index.html" class="nav-item">🏠 Dashboard</a>
            <a href="team-builder.html" class="nav-item" data-nav-action="team-builder">➕ Team erstellen</a>
            <a href="teams.html" class="nav-item">🛡️ Teams</a>
            <a href="spieleranalyse.html" class="nav-item">🔍 Analyse</a>
            <a href="rangliste.html" class="nav-item">🏆 Rangliste</a>
            <a href="punktesystem.html" class="nav-item">📊 Punktesystem</a>
        </div>
        <div id="dt-auth-nav-slot" class="dt-auth-nav-slot" aria-label="Anmeldestatus"></div>
    </div>
</nav>

<nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="icon">🏠</span><span>Dashboard</span></a>
    <a href="team-builder.html" class="nav-item" data-nav-action="team-builder"><span class="icon">➕</span><span>Team</span></a>
    <a href="teams.html" class="nav-item"><span class="icon">🛡️</span><span>Teams</span></a>
    <a href="spieleranalyse.html" class="nav-item"><span class="icon">🔍</span><span>Analyse</span></a>
    <a href="rangliste.html" class="nav-item"><span class="icon">🏆</span><span>Rangliste</span></a>
    <a href="punktesystem.html" class="nav-item"><span class="icon">📊</span><span>Punkte</span></a>
</nav>
<script>
/* Markenlabel synchron füllen, bevor dieser Bereich gemalt wird:
   data-tournament setzt das Pre-Flight im <head>. Spiegel der
   shortLabel-Werte aus tournament-config.js (hier ist noch nichts davon
   geladen); scripts/test-static-nav.js hält beide deckungsgleich, und
   nav.js korrigiert nach dem Boot ohnehin aus APP_CONFIG. */
(function(){try{
    var k=document.documentElement.getAttribute("data-tournament")||"";
    var el=document.querySelector(".navbar-brand .brand-gold");
    if(el) el.textContent=/^cl/.test(k)?"Champions League":"WM 2026";
    // Saison-Zeile unter dem Markennamen (Stil wie .hero-season) - nur CL.
    // Statischer Spiegel fuer den ersten Frame; nav.js setzt nach dem Boot
    // den echten Wert aus APP_CONFIG.seasonLabel.
    var se=document.querySelector(".navbar-brand .brand-season");
    if(se&&/^cl/.test(k)){se.textContent="Saison 2026/2027";se.hidden=false;}
}catch(e){}})();
</script>
<!-- ===== /STATIC NAV ===== -->

<!-- =====================================================
     APP-SHELL-BUEHNE
     shell.js laedt die Seiten hier als persistente Frames und blendet
     sie erst um, wenn die Zielseite fertig gerendert ist. Die alte
     Seite bleibt bis dahin sichtbar und bedienbar; der zuletzt
     besuchte Frame bleibt warm (Zurueck ist sofort da).
     ===================================================== -->
<main class="dt-shell-stage" id="dtShellStage" aria-label="Seiteninhalt"></main>
<div class="dt-shell-progress" id="dtShellProgress" aria-hidden="true"></div>
