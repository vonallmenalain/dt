name: Auto Punkte-Upload

# Vollautomatisches Punkte-Update für das aktive Turnier laut
# tournament-config.js. Läuft an den Spieltagen des Turniers alle 5
# Minuten als GitHub-Cron-Job (zusätzlich jederzeit manuell auslösbar
# via "Run workflow"). Innerhalb des Skripts gibt es einen Pre-Check,
# der prüft, ob im aktuellen Tick überhaupt ein Spiel im Live-/Catch-up-
# Fenster liegt (Default: 30 Minuten VOR bis 150 Minuten NACH Anpfiff)
# oder ob ein beendetes Spiel noch im Final-Recheck liegt (Default:
# 240 Minuten nach Anpfiff). Nur dann wird die API abgefragt. Während
# eines aktiven Fensters macht das Skript standardmäßig eine lange,
# final-first Monitor-Session mit mindestens 520 Ticks im Abstand von
# mindestens 30 Sekunden.
# Das ist bewusst robuster als sich darauf zu verlassen, dass GitHub den
# Cron wirklich alle 5 Minuten startet.
#
# ZWEI JOBS: `vorlauf` und `upload`
# ---------------------------------
# GitHub liefert scheduled workflows nur "so ungefähr". Gemessen an den
# Runs dieses Repos kommt der `2-59/5`-Cron faktisch etwa einmal pro
# Stunde an; am 08.09.2026 kam zwischen 15:02 UTC (erster Takt des
# Spieltags) und 18:29 UTC gar nichts – 3 h 27 min Funkstille, bei
# Anpfiff um 16:45 UTC. Der Lauf musste von Hand gestartet werden.
#
# Das Upload-Skript kann selbst auf das Live-Fenster warten, aber nur
# rund 160 Minuten: seine Session endet 350 min nach Start und braucht
# nach dem Aufwachen noch ~190 min zum Monitoren. Mehr geht in EINEM Job
# ohnehin nicht, weil GitHub jeden Job nach 6 Stunden hart abbricht.
#
# Ein Workflow-RUN darf dagegen viel länger laufen als ein einzelner Job.
# Deshalb wartet der vorgeschaltete Job `vorlauf` (ohne Secrets, ohne
# Firestore-Read, ohne API-Call) auf den Beginn des Live-Fensters; erst
# danach startet `upload` – mit frischem 6-Stunden-Budget genau ab
# Fensteröffnung. Es genügt damit, dass GitHub IRGENDWANN in den rund
# fünf Stunden vor dem Fenster einen einzigen Takt liefert, statt in den
# letzten ~75 Minuten davor.
#
# `upload` läuft über `if: !cancelled()` auch dann, wenn `vorlauf`
# fehlschlägt: das Warten darf den Upload nie verhindern, sondern nur
# besser timen.
#
# WELCHES TURNIER: Scheduled Runs setzen TOURNAMENT_KEY nicht. Das Skript
# nimmt dann APP_CONFIG.serverTournamentKey – das Turnier, dessen
# `defaultActiveFrom` zuletzt erreicht wurde (seit 27.08.2026: cl2627).
# Nicht am Domain-Mapping: in Node gibt es keinen Hostname.
#
# WICHTIG: Der Cron unten ist bewusst auf die SPIELTAGE der Champions
# League 2026/27 beschränkt, damit nicht das ganze Jahr alle 5 Minuten
# Scheduled-Runs starten und Firestore-Reads erzeugen. Quelle der Daten
# ist MATCH_CALENDAR_CL2627 in tournament-config.js; die Cron-Zeilen sind
# eine handgepflegte Kopie davon (YAML kann nicht rechnen).
# `scripts/test-live-schedule.js` (npm run test:live-schedule) prüft, dass
# jeder Spieltag aus dem Kalender von einem Cron-Fenster abgedeckt ist –
# wenn sich Termine verschieben, wird der Test rot. Derselbe Test hält
# fest, dass das Fenster früh genug öffnet (siehe unten).
#
# Die Fenster laufen 09:00–23:59 UTC am Spieltag. Nötig wäre erst 15:00
# UTC – 18:45/21:00 Schweizer Zeit sind 16:45/19:00 UTC im Sommer und
# 17:45/20:00 UTC im Winter, jeweils inklusive 30 Minuten Vorlauf. Die
# sechs zusätzlichen Stunden sind reiner Puffer gegen ausgelassene
# GitHub-Takte: Takte, die zu früh kommen, kosten ~20 s und enden ohne
# API-Call; Takte ab rund fünf Stunden vor dem Fenster halten über
# `vorlauf` den Platz bis zur Fensteröffnung. Der Final-Recheck nach
# Mitternacht braucht keine eigenen Cron-Zeilen: ein Run, der abends
# startet, monitort mit seiner langen Session (bis 350 Minuten) über den
# Abpfiff hinaus.
#
# Zusätzlich gibt es im Skript einen harten Guard auf Basis von
# AUTO_POINTS_FROM / AUTO_POINTS_UNTIL aus tournament-config.js, der
# außerhalb des Turnierfensters sofort exit 0 macht – ohne Firebase-
# Init, ohne Firestore-Read und ohne API-Call. Manuelle Läufe mit
# force_run=true (FORCE_RUN=1) übersteuern diesen Guard.
#
# Benötigte Repo-Secrets (Settings → Secrets and variables → Actions):
#   RAPIDAPI_KEY               RapidAPI / API-Football Key.
#   FIREBASE_SERVICE_ACCOUNT   Service-Account-JSON als String.
#
# Repo-Variables werden fuer diesen Workflow bewusst nicht gelesen.
# Produktive Defaults liegen in tournament-config.js und
# scripts/auto-points-upload.js. Fuer Tests koennen die workflow_dispatch
# Inputs unten einen einzelnen manuellen Run ueberschreiben.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auto-points-upload.yml"
      - "scripts/auto-points-upload.js"
      - "scripts/live-window-wait.js"
      - "scripts/points-public-cache.js"
      - "tournament-config.js"
      - "data-wm2026.js"
      - "data-cl2627.js"
      - "position-overrides.js"
  schedule:
    # Champions League 2026/27 – Ligaphase (Spieltage 1–8).
    # Bewusst bei Minute 2 statt 0 gestartet, weil GitHub Cron-Jobs am
    # Stundenwechsel haeufiger verzoegert oder auslaesst.
    - cron: "2-59/5 9-23 8-10 9 *"             # Spieltag 1: 08.–10.09.2026
    - cron: "2-59/5 9-23 13-14,20-21 10 *"     # Spieltag 2+3: 13./14. + 20./21.10.
    - cron: "2-59/5 9-23 3-4,24-25 11 *"       # Spieltag 4+5: 03./04. + 24./25.11.
    - cron: "2-59/5 9-23 8-9 12 *"             # Spieltag 6: 08./09.12.2026
    - cron: "2-59/5 9-23 19-20,27 1 *"         # Spieltag 7+8: 19./20. + 27.01.2027
    # Champions League 2026/27 – K.-o.-Phase.
    - cron: "2-59/5 9-23 16-17,23-24 2 *"      # K.-o.-Playoffs Hin-/Rueckspiele
    - cron: "2-59/5 9-23 9-10,16-17 3 *"       # Achtelfinale Hin-/Rueckspiele
    - cron: "2-59/5 9-23 6-7,13-14,27-28 4 *"  # Viertelfinale + Halbfinale Hinspiele
    - cron: "2-59/5 9-23 4-5 5 *"              # Halbfinale Rueckspiele
    - cron: "2-59/5 9-23 5 6 *"                # Final: 05.06.2027
  workflow_dispatch:
    inputs:
      force_run:
        description: "Aus = normalen Live-Monitor/Scheduled Run starten. An = Force/Catch-up mit Pre-Check überspringen."
        required: false
        type: boolean
        default: false
      tournament_key:
        description: "Turnier-Key (leer = Default aus tournament-config.js). Fuer einen Backfill z. B. cl2627 (mit force_run=An)."
        required: false
        type: string
        default: ""

concurrency:
  group: auto-points-upload-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Billiger Warte-Job: kein Secret, kein Firestore-Read, kein API-Call.
  # Er haelt den Concurrency-Slot vom (moeglicherweise sehr frueh
  # gelieferten) Cron-Takt bis zur Oeffnung des Live-Fensters.
  vorlauf:
    runs-on: ubuntu-latest
    # Muss ueber LIVE_WINDOW_MAX_WAIT_MIN (320) liegen und unter GitHubs
    # harter 6-Stunden-Grenze bleiben.
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Keine npm-Abhaengigkeiten: das Skript liest nur tournament-config.js.
      - name: Wait for live window
        working-directory: scripts
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run == true && '1' || '0' }}
          TOURNAMENT_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.tournament_key || '' }}
        run: node live-window-wait.js

  upload:
    needs: vorlauf
    # Ein Fehler im Vorlauf darf den Upload nie verhindern – nur ein
    # abgebrochener Run stoppt auch hier.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/package.json

      - name: Install script dependencies
        working-directory: scripts
        run: npm install --no-audit --no-fund --omit=dev

      - name: Run auto points upload
        working-directory: scripts
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run == true && '1' || '0' }}
          TOURNAMENT_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.tournament_key || '' }}
        run: |
          echo "[auto-points] Effective workflow config:"
          if [ "$FORCE_RUN" = "1" ]; then
            echo "mode=force/catch-up"
          else
            echo "mode=live-monitor"
          fi
          echo "defaults=code"
          echo "forceRun=${FORCE_RUN}"
          node auto-points-upload.js
