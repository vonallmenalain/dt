name: Auto Punkte-Upload

# Vollautomatisches Punkte-Update für das aktive Turnier laut
# tournament-config.js. Läuft an den Spieltagen des Turniers alle 5
# Minuten als GitHub-Cron-Job (zusätzlich jederzeit manuell auslösbar
# via "Run workflow"). Innerhalb des Skripts gibt es einen Pre-Check,
# der prüft, ob im aktuellen Tick überhaupt ein Spiel im Live-/Catch-up-
# Fenster liegt (Default: 30 Minuten VOR bis 150 Minuten NACH Anpfiff)
# oder ob ein beendetes Spiel noch im Final-Recheck liegt (Default:
# 240 Minuten nach Anpfiff). Nur dann wird die API abgefragt. Während
# eines aktiven Fensters macht das Skript standardmäßig eine lange,
# final-first Monitor-Session mit mindestens 520 Ticks im Abstand von
# mindestens 30 Sekunden. Wenn ein Schedule-Run zu früh kommt, darf er
# ohne API-Calls auf das nächste Live-Fenster warten.
# Das ist bewusst robuster als sich darauf zu verlassen, dass GitHub den
# Cron wirklich alle 5 Minuten startet.
#
# WELCHES TURNIER: Scheduled Runs setzen TOURNAMENT_KEY nicht. Das Skript
# nimmt dann APP_CONFIG.serverTournamentKey – das Turnier, dessen
# `defaultActiveFrom` zuletzt erreicht wurde (seit 27.08.2026: cl2627).
# Nicht am Domain-Mapping: in Node gibt es keinen Hostname.
#
# WICHTIG: Der Cron unten ist bewusst auf die SPIELTAGE der Champions
# League 2026/27 beschränkt, damit nicht das ganze Jahr alle 5 Minuten
# Scheduled-Runs starten und Firestore-Reads erzeugen. Quelle der Daten
# ist MATCH_CALENDAR_CL2627 in tournament-config.js; die Cron-Zeilen sind
# eine handgepflegte Kopie davon (YAML kann nicht rechnen).
# `scripts/test-live-schedule.js` (npm run test:live-schedule) prüft, dass
# jeder Spieltag aus dem Kalender von einem Cron-Fenster abgedeckt ist –
# wenn sich Termine verschieben, wird der Test rot.
#
# Die Fenster laufen 15:00–23:59 UTC am Spieltag. Das deckt beide
# Anstosszeiten in beiden Zeitzonen ab (18:45/21:00 Schweizer Zeit =
# 16:45/19:00 UTC im Sommer, 17:45/20:00 UTC im Winter) inklusive der
# 30 Minuten Vorlauf. Der Final-Recheck nach Mitternacht braucht keine
# eigenen Cron-Zeilen: ein Run, der abends startet, monitort mit seiner
# langen Session (bis 350 Minuten) über den Abpfiff hinaus.
#
# Zusätzlich gibt es im Skript einen harten Guard auf Basis von
# AUTO_POINTS_FROM / AUTO_POINTS_UNTIL aus tournament-config.js, der
# außerhalb des Turnierfensters sofort exit 0 macht – ohne Firebase-
# Init, ohne Firestore-Read und ohne API-Call. Manuelle Läufe mit
# force_run=true (FORCE_RUN=1) übersteuern diesen Guard.
#
# Benötigte Repo-Secrets (Settings → Secrets and variables → Actions):
#   RAPIDAPI_KEY               RapidAPI / API-Football Key.
#   FIREBASE_SERVICE_ACCOUNT   Service-Account-JSON als String.
#
# Repo-Variables werden fuer diesen Workflow bewusst nicht gelesen.
# Produktive Defaults liegen in tournament-config.js und
# scripts/auto-points-upload.js. Fuer Tests koennen die workflow_dispatch
# Inputs unten einen einzelnen manuellen Run ueberschreiben.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auto-points-upload.yml"
      - "scripts/auto-points-upload.js"
      - "scripts/points-public-cache.js"
      - "tournament-config.js"
      - "data-wm2026.js"
      - "data-cl2627.js"
      - "position-overrides.js"
  schedule:
    # Champions League 2026/27 – Ligaphase (Spieltage 1–8).
    # Bewusst bei Minute 2 statt 0 gestartet, weil GitHub Cron-Jobs am
    # Stundenwechsel haeufiger verzoegert oder auslaesst.
    - cron: "2-59/5 15-23 8-10 9 *"             # Spieltag 1: 08.–10.09.2026
    - cron: "2-59/5 15-23 13-14,20-21 10 *"     # Spieltag 2+3: 13./14. + 20./21.10.
    - cron: "2-59/5 15-23 3-4,24-25 11 *"       # Spieltag 4+5: 03./04. + 24./25.11.
    - cron: "2-59/5 15-23 8-9 12 *"             # Spieltag 6: 08./09.12.2026
    - cron: "2-59/5 15-23 19-20,27 1 *"         # Spieltag 7+8: 19./20. + 27.01.2027
    # Champions League 2026/27 – K.-o.-Phase.
    - cron: "2-59/5 15-23 16-17,23-24 2 *"      # K.-o.-Playoffs Hin-/Rueckspiele
    - cron: "2-59/5 15-23 9-10,16-17 3 *"       # Achtelfinale Hin-/Rueckspiele
    - cron: "2-59/5 15-23 6-7,13-14,27-28 4 *"  # Viertelfinale + Halbfinale Hinspiele
    - cron: "2-59/5 15-23 4-5 5 *"              # Halbfinale Rueckspiele
    - cron: "2-59/5 15-23 5 6 *"                # Final: 05.06.2027
  workflow_dispatch:
    inputs:
      force_run:
        description: "Aus = normalen Live-Monitor/Scheduled Run starten. An = Force/Catch-up mit Pre-Check überspringen."
        required: false
        type: boolean
        default: false
      tournament_key:
        description: "Turnier-Key (leer = Default aus tournament-config.js). Fuer Vorschau-Backfill z. B. cl2526 (mit force_run=An)."
        required: false
        type: string
        default: ""

concurrency:
  group: auto-points-upload-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/package.json

      - name: Install script dependencies
        working-directory: scripts
        run: npm install --no-audit --no-fund --omit=dev

      - name: Run auto points upload
        working-directory: scripts
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run == true && '1' || '0' }}
          TOURNAMENT_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.tournament_key || '' }}
        run: |
          echo "[auto-points] Effective workflow config:"
          if [ "$FORCE_RUN" = "1" ]; then
            echo "mode=force/catch-up"
          else
            echo "mode=live-monitor"
          fi
          echo "defaults=code"
          echo "forceRun=${FORCE_RUN}"
          node auto-points-upload.js
