# =============================================================================
# Netlify-Konfiguration – Build.
#
# Die Seite ist statisch (kein Bundler); der Build-Step besteht aus zwei
# Schritten:
#   1. build-firebase-config.js – setzt den Firebase-Web-API-Key aus der
#      Umgebungsvariable FIREBASE_API_KEY in tournament-config.js ein.
#      Im Repo steht dort nur ein Platzhalter.
#   2. build-asset-versions.js – ersetzt den Platzhalter `__BUILD__` in den
#      `?v=`-Parametern aller HTML-Seiten und in der CACHE_VERSION des
#      Service Workers durch den Commit-SHA des Deploys. So teilen sich
#      alle Seiten EINE Asset-Version (Cache-Treffer beim Seitenwechsel),
#      und jeder Deploy erzeugt automatisch frische URLs + frischen
#      SW-Cache.
#
# Schlaegt einer der Schritte fehl (Exit-Code 1), markiert Netlify den
# Deploy als fehlgeschlagen und laesst die bisherige Version online –
# besser als eine halbgestempelte Seite.
#
# Deploy Previews brauchen FIREBASE_API_KEY ebenfalls (Netlify →
# Environment variables, Scope "All deploy contexts" bzw. zusaetzlich
# "Deploy previews").
# =============================================================================

[build]
  command = "node scripts/build-firebase-config.js && node scripts/build-asset-versions.js"
  publish = "."

# =============================================================================
# Netlify-Konfiguration – Post-Processing AUS.
#
# Netlifys "Asset optimization" (insb. Pretty URLs) schreibt in den
# ausgelieferten HTML-Seiten interne Links um: aus href="rangliste.html"
# wird href="rangliste". Genau das hat die App-Shell auf dem Live-Server
# gebrochen (lokal nie reproduzierbar): Klick-Abfangung und
# Shell-Weiterleitung kannten nur die .html-Dateinamen, die Bottom-Taps
# liefen deshalb als harte Navigation auf /rangliste hinaus. Die Seite
# hat eine eigene, getestete Versionierungs- und Cache-Strategie
# (?v=-Stempel + Service Worker) – Netlify soll die Dateien EXAKT so
# ausliefern, wie sie gebaut wurden.
# =============================================================================

[build.processing]
  skip_processing = true

# =============================================================================
# Netlify-Konfiguration – Einstieg: App-Shell (Vorschlag E, Stufe 2).
#
# `/` liefert die App-Shell (app.html) als Rewrite (Status 200, URL bleibt
# `/`): Seitenwechsel laufen dann ohne Neuladen in der Shell. `force` ist
# noetig, weil sonst die an `/` liegende index.html das Rewrite verdeckt
# (Netlify-Shadowing).
#
# Bewusst NUR `/`: alle direkten Seiten-URLs (index.html, rangliste.html,
# teams.html?manager=..., Deep-Links) bleiben nackte Seiten – einerseits
# als geteilte Links rueckwaerts­kompatibel, andererseits laedt die Shell
# selbst genau diese Dateien in ihre Frames (ein Rewrite darauf ergaebe
# Shell-in-Shell).
# =============================================================================

[[redirects]]
  from = "/"
  to = "/app.html"
  status = 200
  force = true

# Endungslose Seiten-URLs weiter bedienen: Solange Pretty URLs aktiv war,
# sind Links wie /rangliste in Umlauf gekommen (Lesezeichen, offene Tabs,
# geteilte Links). Ohne Post-Processing waeren das 404er – diese Rewrites
# liefern die echten Dateien aus; deren Pre-Flight leitet dann normal in
# die Shell weiter.
[[redirects]]
  from = "/index"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/team-builder"
  to = "/team-builder.html"
  status = 200

[[redirects]]
  from = "/teams"
  to = "/teams.html"
  status = 200

[[redirects]]
  from = "/spieleranalyse"
  to = "/spieleranalyse.html"
  status = 200

[[redirects]]
  from = "/rangliste"
  to = "/rangliste.html"
  status = 200

[[redirects]]
  from = "/punktesystem"
  to = "/punktesystem.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

# =============================================================================
# Netlify-Konfiguration – Caching.
#
# HTML/JS/CSS behalten bewusst Netlifys Default-Verhalten
# (ETag + `max-age=0, must-revalidate` → billige 304-Revalidierung):
# Zusammen mit dem Service Worker (cache-first fuer `?v=`-versionierte
# Assets, stale-while-revalidate fuer Navigationen) ist das der gewollte
# Frische-Mechanismus. KEINE langen Cache-Header fuer JS/CSS setzen –
# service-worker.js selbst wuerde sonst veraltet ausgeliefert und der
# Update-Mechanismus (neue CACHE_VERSION → einmaliger Reload) kaeme zum
# Erliegen; fuer alle anderen Dateien uebernimmt ohnehin der SW-Cache.
#
# Nur echte Langzeit-Assets (App-Icons) bekommen lange Cache-Header;
# sie aendern sich praktisch nie und haben keinen Code-Einfluss.
# =============================================================================

[[headers]]
  for = "/Icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
