# =============================================================================
# Netlify-Konfiguration – Build.
#
# Die Seite ist statisch (kein Bundler); der Build-Step existiert einzig, um
# den Firebase-Web-API-Key aus der Umgebungsvariable FIREBASE_API_KEY in
# tournament-config.js einzusetzen. Im Repo steht dort nur ein Platzhalter.
#
# Ist FIREBASE_API_KEY nicht gesetzt, bricht das Script mit Exit-Code 1 ab:
# Netlify markiert den Deploy als fehlgeschlagen und laesst die bisherige
# Version online – besser als eine Seite ohne funktionierendes Firebase.
#
# Deploy Previews brauchen die Variable ebenfalls (Netlify → Environment
# variables, Scope "All deploy contexts" bzw. zusaetzlich "Deploy previews").
# =============================================================================

[build]
  command = "node scripts/build-firebase-config.js"
  publish = "."

# =============================================================================
# Netlify-Konfiguration – Caching.
#
# HTML/JS/CSS behalten bewusst Netlifys Default-Verhalten
# (ETag + `max-age=0, must-revalidate` → billige 304-Revalidierung):
# Zusammen mit dem Service Worker (cache-first fuer `?v=`-versionierte
# Assets, network-first mit Cache-Fallback fuer den Rest) ist das der
# gewollte Frische-Mechanismus. KEINE langen Cache-Header fuer JS/CSS
# setzen – viele Dateien (admin.js, auth.js, data-*.js, …) werden ohne
# Versions-Parameter eingebunden und wuerden sonst nach einem Deploy
# tagelang veraltet ausgeliefert.
#
# Nur echte Langzeit-Assets (App-Icons) bekommen lange Cache-Header;
# sie aendern sich praktisch nie und haben keinen Code-Einfluss.
# =============================================================================

[[headers]]
  for = "/Icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
